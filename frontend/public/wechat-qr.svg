<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="WeChat QR code placeholder">
  <rect width="256" height="256" fill="#ffffff"/>
  <rect x="8" y="8" width="240" height="240" fill="none" stroke="#202124" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- Fake QR corner markers so it LOOKS like a QR, to prove positioning. -->
  <g fill="#202124">
    <rect x="24" y="24" width="48" height="48"/>
    <rect x="32" y="32" width="32" height="32" fill="#ffffff"/>
    <rect x="40" y="40" width="16" height="16"/>

    <rect x="184" y="24" width="48" height="48"/>
    <rect x="192" y="32" width="32" height="32" fill="#ffffff"/>
    <rect x="200" y="40" width="16" height="16"/>

    <rect x="24" y="184" width="48" height="48"/>
    <rect x="32" y="192" width="32" height="32" fill="#ffffff"/>
    <rect x="40" y="200" width="16" height="16"/>
  </g>
  <text x="128" y="132" text-anchor="middle" font-family="Roboto, system-ui, sans-serif" font-size="14" fill="#5f6368" font-weight="600">WeChat QR</text>
  <text x="128" y="152" text-anchor="middle" font-family="Roboto, system-ui, sans-serif" font-size="12" fill="#80868b">placeholder  replace</text>
  <text x="128" y="168" text-anchor="middle" font-family="Roboto, system-ui, sans-serif" font-size="12" fill="#80868b">public/wechat-qr.svg</text>
</svg>
